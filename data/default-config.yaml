# gowl - Default YAML Configuration
# GObject Wayland Compositor
# Copyright (C) 2026  Zach Podbielniak
#
# Search order:
#   1. ./data/config.yaml
#   2. ~/.config/gowl/config.yaml
#   3. /etc/gowl/config.yaml
#   4. /usr/local/gowl/config.yaml
#
# Generate this file with: gowl --generate-yaml-config > ~/.config/gowl/config.yaml
#
# NOTE: All property keys must be at the root level (flat mapping).
# Key names use hyphens (log-level, not log_level).

# Set to true to ignore all YAML values and keep defaults.
# Useful when relying entirely on C config (equivalent to --no-yaml-config).
# ignore_yaml: true

# Compositor settings
log-level: "warning"
log-file: "~/.config/gowl/gowl.log"
repeat-rate: 25
repeat-delay: 600
terminal: "gst"
menu: "wofi --show drun"
sloppyfocus: true
# Power off the internal laptop panel (eDP/LVDS/DSI) while the lid is
# shut and an external display is connected.  Set false to keep driving
# a closed-lid panel.
manage_lid: true
# Idle and power.  idle-timeout is when the session counts as idle (the
# screenlock module's auto-lock has its own timer, see below); dpms-timeout
# powers every output off, and any input powers them back on.  A window
# holding an idle inhibitor -- a video player -- holds both off.
idle-timeout: 300
dpms-timeout: 0

# Locking.
#
# `lock-command' is the program that draws the lock screen and takes the
# password.  It is a separate program on purpose, the way i3lock and
# swaylock are: it holds the password and it dlopens PAM modules, and
# under `cmacs --gowl' the compositor is the editor, with an Elisp
# evaluator and a D-Bus interface in the same address space.
#
# It speaks ext-session-lock-v1, which is what makes the split safe
# rather than merely tidy: gowl owns the locked state, so a lock program
# that crashes leaves the screen sealed -- and gowl starts a new one.
# Set it to "" to use the in-process `screenlock' module instead.
#
# Everything that locks goes through it: Super+Shift+l, `gowl-msg lock',
# the screenlock module's idle timer, and the suspend below.
lock-command: "gowl-lock"

# Take a logind delay inhibitor and lock the screen BEFORE the machine
# sleeps.  Without it, closing the lid or `systemctl suspend' leaves an
# unlocked desktop to wake up to -- listening for the suspend without
# holding an inhibitor is a race with the kernel that the session loses.
lock-on-suspend: true
# Let a fullscreen window that asks for it (tearing-control-v1: a game)
# be presented without vsync.  Never applied to anything else.
allow-tearing: false
# What a window's request to be activated does: smart (focus if visible
# on the selected monitor, else mark urgent), urgent, focus, none.
focus-on-activate: smart

# Palette -- one set of colours for the whole session.
#
# Every colour setting below, in this file and in any module, may be a
# literal ("#rrggbb" or "#rrggbbaa"), a name from this palette, or
# "name/aa" for the same colour at a different opacity.  Change the
# flavour here and the borders, the bar and the lock screen all follow.
#
# Built-in flavours: mocha, macchiato, frappe, latte (Catppuccin), and
# dwm for the colours gowl used before palettes existed.  Any key you
# add overrides that flavour's entry.
palette:
  name: mocha
  # accent: "#89b4fa"

# Appearance
border-width: 2
border-color-focus: accent
border-color-unfocus: surface
border-color-urgent: red

# Layout
mfact: 0.55
nmaster: 1

# Tags
tag-count: 9

# Motion. Position and size animate together using a surface-tree snapshot.
# Entrances pop from 84% with a small overshoot; layout moves do not overshoot.
# These settings take effect only when modules.animation.enabled is true.
animations: true
animation-duration: 260       # move/resize and release jiggle; 0 disables animations
animation-duration-open: 360  # pop duration; opacity arrives within 120 ms
animation-duration-close: 180 # squeeze/shrink with a separate opacity curve
animation-popin-scale: 0.84   # opening/closing zoom, 0.5..1.0; 1 removes base zoom
animation-jiggle-strength: 1.0 # 0..2; 0 removes jiggle, 2 doubles it
animation-curve-open: "ease-out-back"
animation-curve: "ease-out-expo"
# Curves: linear, ease-out-quint, ease-in-out-cubic, almost-linear, quick,
# ease-out-expo, ease-out-back, spring. The last two overshoot.
# For Omarchy's more restrained entrance: scale 0.87, curve ease-out-quint.

# Desktop cube (modules.cube.enabled).  A tag switch turns the desktop as
# one side of a solid instead of cutting to it, one turn per tag crossed --
# tag 1 to tag 4 is three turns and shows tags 2 and 3 on the way past.
# Needs the GLES2 renderer; with any other one the module stands down and
# tag switches stay instant.
cube: true
cube-duration: 520        # one turn, in ms; 0 disables the cube
cube-step-duration: 150   # added per EXTRA turn, capped at 3x cube-duration
cube-curve: "ease-in-out-cubic"   # any curve from the animation-curve set
cube-faces: 4             # sides of the solid, 3..12; 4 is a cube
cube-zoom: 1.45           # camera pull-back mid-turn; 1.0 keeps it filling
cube-pitch: 14            # camera elevation in degrees; 0 hides the lid
cube-shading: 0.78        # 0..1, how dark a side gets as it turns away
cube-reflection: 0.32     # 0..1 floor reflection; 0 skips the second pass
cube-motion-blur: 0.35    # 0..1, scaled by how fast it is turning
cube-caps: true           # draw the top and bottom of the solid
cube-backdrop-color: "#12141f"
cube-all-monitors: false  # true also turns outputs that are not focused

# Desktop cube: drive the rotation directly with a three-finger swipe.
# A gesture the cube claims never reaches the focused client, so turning
# this off is also how you give applications their three-finger swipes back.
cube-gesture: true

# Overview (modules.expo.enabled).  Every tag at once, as a grid of live
# thumbnails.  Bind a key to it with
#   "Super+grave": { action: ipc_command, arg: "expo" }
# or swipe up with four fingers.
expo: true
expo-duration: 340        # ms to zoom out and back
expo-curve: "ease-out-expo"
expo-tags: 9              # tags shown, 1..9; fewer means bigger tiles
expo-columns: 0           # 0 picks a near-square grid
expo-gap: 0.06            # spacing as a fraction of a tile
expo-corner: 0.035        # tile corner rounding, as a fraction of a tile
expo-dim: 0.45            # how much dimmer an unselected tag is
expo-hide-empty: false    # drop tags with no windows from the grid
expo-backdrop-color: "#12141f"

# Window switcher (modules.switcher.enabled).  Alt-tab as a strip of live
# window previews.  Hold Super or Alt and tap Tab; let go to commit.
switcher: true
switcher-duration: 220    # ms to slide from one card to the next
switcher-curve: "ease-out-expo"
switcher-scale: 0.52      # card width as a fraction of the output
switcher-spacing: 0.62    # distance between cards, as a fraction of a card
switcher-angle: 52        # degrees the off-centre cards turn away; 0 is flat
switcher-reflection: 0.28
switcher-all-tags: false  # true also lists windows on other tags
switcher-backdrop-color: "#0e1018"

# Magnifier (modules.magnifier.enabled).  Hold the modifier and scroll.
# A scroll the magnifier claims never reaches the client, so the modifier
# has to be one applications do not use.
magnifier: true
magnifier-max: 8.0        # how far in it will go
magnifier-step: 1.25      # multiplier per wheel click
magnifier-smoothing: 120  # ms for the zoom and pan to catch up; 0 is instant
magnifier-follow-cursor: true
magnifier-smooth: true    # false shows the actual pixels, unfiltered
magnifier-modifier: "Super"   # Super, Alt, Ctrl or Shift

# The system tray.  Off by default here and on under cmacs --gowl.
#
# gowl becomes the machine's StatusNotifierItem WATCHER and HOST: it
# owns org.kde.StatusNotifierWatcher, keeps the register of items, and
# says somebody is willing to display them -- which several applications
# check before publishing an icon at all.  Zoom, Deskflow, the Proton
# Mail bridge, Solaar, Syncthing and Steam all put their only
# always-available interface there.
#
# It never takes the name from another tray and never queues for it, so
# a desktop that already has one keeps it and gowl stands down with a
# line in the log.  Two watchers on one bus is how applications end up
# registered with the one nobody is displaying.
#
# OWNING THE REGISTER IS NOT DRAWING IT.  Add the `tray' widget to a bar
# region for that (see the bar's widgets-* keys below).  The two are
# separate because an application that cannot find a watcher when it
# starts hides its icon and does not look again, so the register has to
# exist whether or not anything is currently showing it.
#
#   double left    activate -- for nearly every application, "show me
#                  your window".  Two clicks because one is too easy to
#                  do by accident on a strip of 22-pixel targets
#   right          the application's own menu
#   middle         secondary activate
#   scroll         forwarded, which is how a volume applet works
tray: false

# The cathode ray tube (modules.crt.enabled).  Off by default, and the
# only effect here that is not behind a window: it captures the finished
# screen and puts the WHOLE of it back through a tube -- curved glass,
# scan lines, phosphor triads, halation, and three guns that do not quite
# agree at the corners.  `crt: true' has it on from the start, and it is
# the last stop on the Super+Shift+" tour of looks (see window-backdrop
# below).  There is a `toggle_crt' action too, bound to nothing by
# default: bind it if you want a key of its own for the tube.
#
# WORTH KNOWING BEFORE LEAVING IT ON: the pointer is not curved.  It is
# on a hardware plane rather than in the scene, so the capture never
# contains it and the shader never sees it -- it sits where it really is
# while everything under it has moved.  At the default curvature that is
# about a dozen pixels at 1080p, worst two thirds of the way out and none
# at all in the middle or at the edges.  `crt-curvature: 0', or the
# `flat' preset, is the answer for anybody who wants the phosphor without
# the parallax.
#
# It costs one extra render of the whole scene per frame IT DRAWS, on
# every output that has it -- and it only draws when something under the
# glass has changed, so a still desktop costs nothing.  (The one visible
# consequence: the crt-hum bar drifts while something is happening and
# holds still when nothing is.)
crt: false
#
# Which tube.  These differ in more than one number each, because the
# machines did:
#
#   flat       scan lines and phosphor, no glass at all
#   trinitron  a CYLINDER -- curved across, flat down -- with a grille
#   consumer   the tube in the corner of the living room in 1998
#   broadcast  a grade-1 studio monitor: nearly flat, a fine spot
#   arcade     a cabinet tube run hot, round and dark at the edges
crt-preset: consumer
#
# Everything below overrides the preset.  Leave a key out and the preset
# decides it.
#
# crt-curvature: 0.45     # 1/R of the faceplate, R in half screen widths.
#                         # 0 is flat; past 0.8 the corners eat real desktop
# crt-curvature-y: 1.0    # the vertical share of it: 1 a sphere, 0 a cylinder
# crt-scanline: 0.55      # how deep the dark glass between lines cuts
# crt-lines: 0            # lines down the raster; 0 is one per four pixels
# crt-beam: 0.16          # the spot's width at black, in scan lines
# crt-beam-bloom: 0.18    # how much wider at full white.  THIS is the one
#                         # that makes it a tube and not a striped overlay
# crt-mask: 0.30          # phosphor triad depth
# crt-mask-kind: slot     # none, grille (Trinitron), shadow, slot
# crt-mask-size: 0        # pixels per triad; 0 scales it to the screen
# crt-bloom: 0.45         # halation -- light scattered in the faceplate
# crt-bloom-cut: 0.45     # the level it starts from
# crt-glow-scale: 6       # how far the capture shrinks before it is blurred
# crt-glow-passes: 3      # box passes of that blur
# crt-vignette: 0.22      # how much darker the edge of the glass is
# crt-corner: 0.06        # the tube's corner radius, in half screen heights
# crt-convergence: 1.2    # how far red and blue miss at the corner, in pixels
# crt-hum: 0.02           # the slow bright bar drifting up a tired tube
# crt-gamma: 2.4          # the tube's transfer exponent
# crt-brightness: 1.03    # a final gain, to pay the vignette back

# What shows through a translucent window.  Thirteen of them, plus none
# -- and one that is not a backdrop at all:
#
#   rain       drops that collect, run and streak       (modules.liquidrain)
#   storm      the same, with lightning                 (modules.liquidrain)
#   snow       flakes that settle, melt and run off           (modules.snow)
#   leaves     autumn, until the wind takes them            (modules.leaves)
#   fizz       bubbles rising through a carbonated drink      (modules.fizz)
#   submerged  seen from under water                     (modules.submerged)
#   embers     sparks from a fire below, through the heat  (modules.embers)
#   soap       an iridescent film, draining and popping  (modules.soapfilm)
#   dew        an orb web, every bead a lens                   (modules.dew)
#   water      refracted through a MOVING water surface (modules.liquidwater)
#   glass      refracted through the window as a bevelled slab
#                                                        (modules.liquidglass)
#   bokeh      thrown out of focus by a real aperture         (modules.blur)
#   blur       the wallpaper, blurred behind it               (modules.blur)
#   none       the desktop, straight through
#   crt        NOT a backdrop: nothing behind the windows, and the
#              whole screen on a cathode ray tube        (modules.crt)
#
# THE MODULE IT NAMES HAS TO BE ENABLED.  Every one is opt-in below, and
# they are alternatives rather than layers -- each draws into the same
# place in the same window's tree, so only the one named here draws.
# Setting `window-backdrop: blur' and leaving modules.blur disabled gets
# you nothing, and so does enabling modules.blur while this says glass.
#
# `storm' is the rain module with the lightning on, and `bokeh' is the
# blur module with a different kernel, so neither needs a module of its
# own.
#
# Super+Shift+" (cycle_backdrop) steps through all fifteen at runtime,
# and the layout indicator names the one it landed on.  `crt' is last,
# after `none': it is a different KIND of thing -- every stop before it
# changes what is behind a window and that one changes the screen.
#
# The tube is ALSO an independent switch (`crt' above, and the
# `toggle_crt' action), so it can be on beside the rain.  The tour only
# touches it when it lands on its stop or leaves it, never when it moves
# between backdrops.
window-backdrop: glass

# Frosted glass and shadows (modules.blur.enabled, window-backdrop: blur).
# The blur is of the WALLPAPER, computed once and cropped per window --
# not of other windows.  A translucent window over the desktop looks
# right; one over another window shows blurred wallpaper rather than a
# blurred copy of the window below.
#
# The SHADOWS are not part of the choice above: they are this module's
# alone and stay whichever backdrop is selected, including none.
blur: true
blur-downscale: 4         # 1..8; higher is cheaper and softer
blur-passes: 3            # 1..6; more is smoother and slower
blur-brightness: 0.9
shadow: true
shadow-radius: 28         # softness in pixels; 0 disables shadows
shadow-opacity: 0.42
shadow-offset-x: 0
shadow-offset-y: 10
shadow-color: "#000000"

# Liquid glass (modules.liquidglass.enabled, window-backdrop: glass).
# One ray traced per pixel through a bevelled slab: the rim bends what is
# behind the middle out towards it, splits it into colours and catches a
# line of light, and the slab is very slightly DOMED so the middle
# magnifies rather than merely frosting.  Lengths are logical pixels.
glass-bevel: 56           # width of the bent zone along the edge
glass-thickness: 110      # slab depth: how far the edge pulls
glass-slope: 3.0          # above 1 the field folds -- where the liquid look is
glass-lens: 0.055         # whole-surface magnification; 0 is a flat pane
glass-centre-clarity: 0.45 # how unfrosted the middle is; 0 is pure blur
glass-sheen: 0.30         # highlight the dome catches
glass-dispersion: 1.6     # colour fringe, in PIXELS, not a share
glass-rim: 1.76
glass-shade: 0.46

# Liquid water (modules.liquidwater.enabled, window-backdrop: water).
# A real height field, refracted at n = 1.333.  `water-preset' is a whole
# tuned set: pool, fountain, pond, sea, storm.  `water-intensity' scales
# how rough it is without touching the wavelength.
#
# THIS ONE NEVER SETTLES.  While a translucent window is on a screen,
# that screen is rendering; `water-fps' is the throttle.
water-preset: sea
water-intensity: 0.4
water-fps: 30             # 0 draws every frame the output offers
water-scale: 2            # render at 1/this of the window, then stretch

# Lightning (window-backdrop: storm, or rain-lightning with plain rain).
# A flash is three to five separate return strokes tens of milliseconds
# apart, and the gaps between flashes are EXPONENTIAL around the rate
# rather than a fixed interval -- a storm is a Poisson process, and a
# metronome is half of what gives a fake one away.
rain-lightning: false     # `storm' forces this on whatever it says
rain-lightning-rate: 9.0  # MEAN seconds between strikes, 0.5..300
rain-lightning-power: 1.0 # 0..2; 0 leaves the rain and takes the flash

# Bokeh (modules.blur.enabled, window-backdrop: bokeh).  The same one
# output-sized picture the blur makes, softened with a DISC instead of a
# Gaussian: an out-of-focus point of light becomes the shape of the
# aperture, evenly filled and hard-edged.
#
# `bokeh-highlight' is the one that decides whether any of it is visible.
# A wallpaper has no values above 1.0, so the dynamic range a real lens
# works with has to be put back by hand; at 0 this is a box blur with
# hard edges.
bokeh-radius: 34          # the defocus disc, in pixels
bokeh-blades: 6           # 3..12 is a polygon; under 3 is a circle
bokeh-rotation: 12        # degrees; every highlight shares it
bokeh-samples: 128        # paid once per tag switch; under ~96 is grainy
bokeh-downscale: 2        # 1 keeps small highlights, at four times the cost
bokeh-highlight: 5.0      # how much a bright sample dominates its disc
bokeh-threshold: 0.55     # the luminance it has to beat
bokeh-edge: 0.22          # spherical aberration: a brighter rim
bokeh-brightness: 1.0

# The four newest animated backdrops.  Each has a `<fx>-preset' naming a
# whole tuned set, an `<fx>-intensity' scaling how much is happening, and
# an `<fx>-fps' throttle -- and around twenty override keys apiece that
# are documented in docs/configuration.org rather than here.
#
# ALL OF THEM NEVER SETTLE.  While a translucent window is on a screen,
# that screen is rendering.

# Soap film: thin-film interference.  `soap-thickness' is in NANOMETRES
# and is the whole effect -- the colour of a pixel is computed from the
# local thickness, so it decides how many bands are stacked up the pane.
soap-preset: drifting     # fresh, drifting, thin, oil, bubble
soap-intensity: 1.0
soap-fps: 30

# Embers: a fire below the window.  `embers-temperature' is in KELVIN and
# is the palette: the colour is the Planckian locus and the brightness is
# its FOURTH power, so it is a far stronger knob than it looks.
embers-preset: embers     # dying, embers, campfire, forge, wildfire
embers-intensity: 1.0
embers-fps: 30

# Submerged: seen from under water.  `submerged-depth' is in METRES and
# the colour follows from it -- water absorbs red about twenty times
# faster than blue, so the blue is what survives rather than a tint.
submerged-preset: reef    # pool, reef, lake, deep, murk
submerged-intensity: 1.0
submerged-fps: 30

# Dew: an orb web.  `dew-spacing' is the Rayleigh-Plateau wavelength --
# a coated fibre breaks into a regular string of drops -- and `dew-depth'
# is in a bead's own radii, past 2 of which it inverts what is behind it.
dew-preset: dawn          # gossamer, dawn, heavy, tattered, frostweb
dew-intensity: 1.0
dew-fps: 30

# Wallpaper.  `wallpaper' is the picture every tag uses; wallpaper-tags
# overrides it for individual tags, and a tag with no entry keeps the
# default -- so this is additive to an existing config.
wallpaper-fade: 320       # ms to cross-fade between them; 0 cuts
# wallpaper-tags:
#   1: "~/Pictures/code.jpg"
#   4: "~/Pictures/mail.png"

# ... and wallpaper-outputs overrides it per SCREEN, which beats both of
# the above.  A 21:9 desk monitor and a 16:9 laptop lid cannot share one
# picture without cropping a third off one of them, and unlike the tag,
# the shape of a panel does not change.  Keys are the same output keys
# `monitors:' takes -- a connector name, "Make Model", "Make Model
# Serial", or "*" -- and the value is a path, or a mapping that also
# names a scaling mode for that screen alone.
# wallpaper-outputs:
#   "DP-1": "~/Pictures/ultrawide.png"
#   "eDP-1": { path: "~/Pictures/laptop.png", mode: fit }

# Scrolling layout: column width as a fraction of the usable width.
# 0.5 shows two columns at a time, 1.0 shows one.  Matches Hyprland's
# scrolling.column_width so a config translates.
scroll-column-width: 0.5

# Windows that get NO effects: no backdrop, no shadow, no open/close
# animation.  Added to a built-in list -- steam, steamwebhelper and
# mutter-devkit -- which cannot be configured away, so games and a
# nested GNOME session are covered with nothing written here.
#
# Each name is matched case-insensitively against the window's app_id
# AND against the command name of its process and every ancestor of it,
# so naming a launcher covers everything that launcher starts.
#
# The other way in needs no config at all: GOWL_NO_FX=1 (or true) in a
# process's environment switches the effects off for that process and
# everything it launches, which is what to put in a .desktop file's
# Env= or in front of a command.
#
#   no-fx-apps: "obs, vlc"
#   no-fx-apps: [obs, vlc]
no-fx-apps: ""

# Keybind format:
#   "Modifier+Modifier+Key":
#     { action: <action>, arg: "<argument>", desc: "<description>" }
#
# Modifier names: Super (Logo), Shift, Ctrl (Control), Alt (Mod1), Mod2, Mod3, Mod5
# Action values:  spawn, kill_client, toggle_float, toggle_fullscreen, focus_stack,
#                 focus_monitor, tag_view, tag_set, tag_toggle_view, tag_toggle,
#                 move_to_monitor, set_mfact, inc_nmaster, set_layout, cycle_layout,
#                 set_split, zoom, quit, reload_config, ipc_command, lock, custom
#
# "arg"  is action-specific and optional.
# "desc" is optional, never affects dispatch, and is what a cheatsheet
#        renders instead of an action name -- the MCP `list_keybinds'
#        tool returns it, and cmacs's `cmacs-gowl-describe-keybinds'
#        builds its listing from it.  A bind with no desc still lists,
#        showing its action and arg.
#
# "custom" hands its arg to an embedder rather than to the compositor.
# Standalone gowl has no handler for it, so such a bind is inert here;
# under `emacs --gowl' the arg is evaluated as an Elisp form.
keybinds:
  # Launch applications
  "Super+Return": { action: spawn, arg: "gst", desc: "Terminal" }
  "Super+p": { action: spawn, arg: "wofi --show drun", desc: "App launcher" }
  "Super+Shift+p": { action: spawn, arg: "wofi --show run", desc: "Run command" }

  # Client management
  "Super+Shift+c": { action: kill_client, desc: "Close window" }
  "Super+Shift+space": { action: toggle_fullscreen, desc: "Toggle fullscreen" }
  "Super+Shift+Return": { action: zoom, desc: "Promote to master" }

  # Focus navigation
  "Super+j": { action: focus_stack, arg: "+1", desc: "Focus next window" }
  "Super+k": { action: focus_stack, arg: "-1", desc: "Focus previous window" }

  # Master area adjustment
  "Super+h": { action: set_mfact, arg: "-0.05", desc: "Shrink master area" }
  "Super+l": { action: set_mfact, arg: "+0.05", desc: "Grow master area" }
  "Super+i": { action: inc_nmaster, arg: "+1", desc: "More master windows" }
  "Super+d": { action: inc_nmaster, arg: "-1", desc: "Fewer master windows" }

  # Layout selection
  "Super+t": { action: set_layout, arg: "tile", desc: "Tile layout" }
  # Both f keys are the WINDOW, not the layout.  Fullscreen and floating
  # are what you reach for mid-task; changing the whole tag's layout by
  # accident while looking for either is the more expensive mistake, and
  # a tag that has quietly gone to the float layout looks like the tiling
  # broke rather than like a key was mispressed.
  #
  # Floating a window takes it out of the tiling and re-tiles what is
  # left; unfloating puts it back into the current tag's layout, at
  # wherever that layout decides.
  #
  # The float LAYOUT -- every window on the tag floating at once -- has
  # no key of its own.  It is reached by cycling, like the eight other
  # layouts that never had one.
  "Super+f": { action: toggle_fullscreen, desc: "Fullscreen this window" }
  "Super+Shift+f": { action: toggle_float, desc: "Float / unfloat this window" }
  # A floating window sits ON TOP of the tiling -- that is what floating
  # is.  These put one behind it instead, so the tiles underneath can be
  # worked on without moving or closing it.  The window keeps the
  # keyboard while it is down, so the same key brings it back.
  #
  # The second key does every floating window visible on the output at
  # once: if any of them is still on top they all go down, and only when
  # all of them are down does it bring them back.
  "Super+Alt+b":
    { action: toggle_below, desc: "This floating window behind the tiling" }
  "Super+Ctrl+Alt+b":
    { action: toggle_below_all, desc: "All floating windows behind the tiling" }
  "Super+m": { action: set_layout, arg: "monocle", desc: "Monocle layout" }
  "Super+Shift+m": { action: set_layout, arg: "tabbed", desc: "Tabbed layout" }
  # HDR on this output, where it is offered.  Not tone mapping: SDR
  # content is passed through, so this is a toggle, not a default.
  "Super+Shift+h": { action: toggle_hdr, desc: "HDR on this output" }
  "Super+Tab": { action: cycle_layout, desc: "Next layout" }
  "Super+Shift+Tab":
    { action: cycle_layout, arg: "-1", desc: "Previous layout" }
  "Super+v": { action: set_split, arg: "vsplit", desc: "Vertical split" }
  "Super+Shift+v": { action: set_split, arg: "normal", desc: "Horizontal split" }

  # Scratchpad: a panel of windows that slides up from the bottom of the
  # focused output, the quake shell's size.  Needs the scratchpad module.
  "Super+s":
    { action: ipc_command, arg: "scratchpad-toggle", desc: "Scratchpad: show / hide" }
  "Super+Alt+s":
    { action: ipc_command, arg: "scratchpad-add", desc: "Scratchpad: send the focused window" }
  "Super+Ctrl+s":
    { action: ipc_command, arg: "scratchpad-remove", desc: "Scratchpad: bring the focused window back" }
  # The same with Shift.  Super+Ctrl+s has to be bound either way: left to
  # fall through, a terminal gets it as Ctrl+S -- XOFF -- and stops
  # echoing, which looks like the window died.
  "Super+Ctrl+Shift+s":
    { action: ipc_command, arg: "scratchpad-remove", desc: "Scratchpad: bring the focused window back" }

  # Multi-monitor
  "Super+comma": { action: focus_monitor, arg: "-1", desc: "Focus left monitor" }
  "Super+period": { action: focus_monitor, arg: "+1", desc: "Focus right monitor" }
  "Super+Shift+comma":
    { action: move_to_monitor, arg: "-1", desc: "Move to left monitor" }
  "Super+Shift+period":
    { action: move_to_monitor, arg: "+1", desc: "Move to right monitor" }

  # View all tags / tag all
  "Super+0": { action: tag_view, arg: "0" }
  "Super+Shift+0": { action: tag_set, arg: "0" }

  # Tag switching (Super+1 through Super+9)
  # arg is the tag bitmask: tag N = 1 << (N-1)
  "Super+1": { action: tag_view, arg: "1" }
  "Super+2": { action: tag_view, arg: "2" }
  "Super+3": { action: tag_view, arg: "4" }
  "Super+4": { action: tag_view, arg: "8" }
  "Super+5": { action: tag_view, arg: "16" }
  "Super+6": { action: tag_view, arg: "32" }
  "Super+7": { action: tag_view, arg: "64" }
  "Super+8": { action: tag_view, arg: "128" }
  "Super+9": { action: tag_view, arg: "256" }

  # Tag assignment (Super+Shift+1 through Super+Shift+9)
  "Super+Shift+1": { action: tag_set, arg: "1" }
  "Super+Shift+2": { action: tag_set, arg: "2" }
  "Super+Shift+3": { action: tag_set, arg: "4" }
  "Super+Shift+4": { action: tag_set, arg: "8" }
  "Super+Shift+5": { action: tag_set, arg: "16" }
  "Super+Shift+6": { action: tag_set, arg: "32" }
  "Super+Shift+7": { action: tag_set, arg: "64" }
  "Super+Shift+8": { action: tag_set, arg: "128" }
  "Super+Shift+9": { action: tag_set, arg: "256" }

  # Tag toggle view (Super+Ctrl+1 through Super+Ctrl+9)
  "Super+Ctrl+1": { action: tag_toggle_view, arg: "1" }
  "Super+Ctrl+2": { action: tag_toggle_view, arg: "2" }
  "Super+Ctrl+3": { action: tag_toggle_view, arg: "4" }
  "Super+Ctrl+4": { action: tag_toggle_view, arg: "8" }
  "Super+Ctrl+5": { action: tag_toggle_view, arg: "16" }
  "Super+Ctrl+6": { action: tag_toggle_view, arg: "32" }
  "Super+Ctrl+7": { action: tag_toggle_view, arg: "64" }
  "Super+Ctrl+8": { action: tag_toggle_view, arg: "128" }
  "Super+Ctrl+9": { action: tag_toggle_view, arg: "256" }

  # Tag toggle on client (Super+Shift+Ctrl+1 through Super+Shift+Ctrl+9)
  "Super+Shift+Ctrl+1": { action: tag_toggle, arg: "1" }
  "Super+Shift+Ctrl+2": { action: tag_toggle, arg: "2" }
  "Super+Shift+Ctrl+3": { action: tag_toggle, arg: "4" }
  "Super+Shift+Ctrl+4": { action: tag_toggle, arg: "8" }
  "Super+Shift+Ctrl+5": { action: tag_toggle, arg: "16" }
  "Super+Shift+Ctrl+6": { action: tag_toggle, arg: "32" }
  "Super+Shift+Ctrl+7": { action: tag_toggle, arg: "64" }
  "Super+Shift+Ctrl+8": { action: tag_toggle, arg: "128" }
  "Super+Shift+Ctrl+9": { action: tag_toggle, arg: "256" }

  # Screenshot.  Reaches the screenshot module by NAME through
  # ipc_command, so this line needs to know nothing about it -- and
  # does nothing at all when the module is not loaded.  The capture is
  # saved under ~/Pictures/Screenshots and put on the clipboard.
  "Super+Shift+s": { action: ipc_command, arg: "screenshot-area", desc: "Screenshot: select a region" }
  "Super+Print": { action: ipc_command, arg: "screenshot-window", desc: "Screenshot: focused window" }
  "Print": { action: ipc_command, arg: "screenshot-screen", desc: "Screenshot: whole screen" }

  # Session
  "Super+Shift+q": { action: quit, desc: "Quit gowl" }
  # Focus by direction, the previous window, and the urgent one.
  "Super+Ctrl+h": { action: focus_dir, arg: left, desc: "Focus left" }
  "Super+Ctrl+j": { action: focus_dir, arg: down, desc: "Focus down" }
  "Super+Ctrl+k": { action: focus_dir, arg: up, desc: "Focus up" }
  "Super+Ctrl+l": { action: focus_dir, arg: right, desc: "Focus right" }
  "Super+Ctrl+u": { action: focus_urgent, desc: "Focus the urgent window" }
  "Super+Ctrl+Tab": { action: focus_last, desc: "Focus the previous window" }
  # Pin the focused window to every tag; enter resize mode (see modes:).
  "Super+Shift+t": { action: toggle_sticky, desc: "Pin / unpin window" }
  "Super+r": { action: mode, arg: resize, desc: "Resize mode" }
  # Screen off by hand (any input half a second later turns it back on).
  "Super+Ctrl+o": { action: output_power, arg: "off", desc: "Screens off" }
  "Super+Shift+r": { action: reload_config, desc: "Reload config" }
  "Super+Shift+l": { action: lock, desc: "Lock the session" }

  # Media, volume and brightness keys.
  #
  # These take no modifier, which dispatch handles the same as any
  # other bind (the cleaned modifier mask is simply 0).  The keysyms
  # resolve through xkb_keysym_from_name() like every other key name.
  #
  # wpctl comes with wireplumber, so it is present wherever pipewire
  # is; brightnessctl and playerctl are separate packages and these
  # binds are inert without them.  -l 1.0 caps the sink at 100% so a
  # held key cannot drive it into amplification.
  "XF86AudioRaiseVolume":
    { action: spawn, desc: "Volume up",
      arg: "wpctl set-volume -l 1.0 @DEFAULT_AUDIO_SINK@ 5%+" }
  "XF86AudioLowerVolume":
    { action: spawn, desc: "Volume down",
      arg: "wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-" }
  "XF86AudioMute":
    { action: spawn, desc: "Mute output",
      arg: "wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle" }
  "XF86AudioMicMute":
    { action: spawn, desc: "Mute microphone",
      arg: "wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle" }
  "XF86MonBrightnessUp":
    { action: spawn, desc: "Brightness up",
      arg: "brightnessctl set 5%+" }
  "XF86MonBrightnessDown":
    { action: spawn, desc: "Brightness down",
      arg: "brightnessctl set 5%-" }
  "XF86AudioPlay":
    { action: spawn, desc: "Play / pause", arg: "playerctl play-pause" }
  "XF86AudioNext":
    { action: spawn, desc: "Next track", arg: "playerctl next" }
  "XF86AudioPrev":
    { action: spawn, desc: "Previous track", arg: "playerctl previous" }
  "XF86AudioStop":
    { action: spawn, desc: "Stop playback", arg: "playerctl stop" }

# Window rules
# Each rule matches clients by app-id and/or title, then applies settings.
# Fields:
#   app-id:   (string) Wayland app_id to match (omitted = match any)
#   title:    (string) Window title pattern to match (omitted = match any)
#   regex:    (bool)   Interpret app-id/title as PCRE regexes (default: glob)
#   tags:     (int)    Bitmask of tags to assign (0 = no tag override)
#   floating: (bool)   Whether the client should float
#   monitor:  (int)    Monitor index to place on (-1 = default)
#   width:    (int)    Explicit pixel width for floated matches (0 = natural)
#   height:   (int)    Explicit pixel height for floated matches (0 = natural)
#   center:   (bool)   Center floated match on target monitor (default true)
rules:
  # Tag assignment
  - app-id: "firefox"
    tags: 2
  - app-id: "thunderbird"
    tags: 4

  # Modal / popup auto-float.  Rules for apps whose window
  # should stay above the tiled Emacs frame rather than join
  # the layout.
  - app-id: "zoom"
    floating: true
  - title: "^Zoom Meeting$"
    floating: true
    regex: true
  - title: "Join Meeting"
    floating: true
  - app-id: "ch.protonmail.protonmail-bridge"
    floating: true
  - app-id: "org.keepassxc.KeePassXC"
    title: "Unlock"
    floating: true
  - app-id: "pinentry"
    floating: true
  - app-id: "pinentry-gtk-2"
    floating: true
  - app-id: "pinentry-qt"
    floating: true
  - app-id: "pavucontrol"
    floating: true
  - app-id: "nm-connection-editor"
    floating: true
  - app-id: "blueman-manager"
    floating: true
  - title: "^Open File$"
    floating: true
  - title: "^Save As$"
    floating: true
  - title: "^Print$"
    floating: true
  - title: "^Preferences$"
    floating: true
  - app-id: "imv"
    floating: true
  - app-id: "feh"
    floating: true

# Guake-style dropdown windows
# Each entry is lazy-spawned on first keybind press, captured via the
# compositor's prefloat-hint mechanism, then toggled show/hide on
# subsequent presses.  The window follows the currently focused output.
# Fields:
#   name:       (string)  Unique identifier for the dropdown
#   spawn-cmd:  (string)  Shell command spawned on first toggle
#   keybind:    (string)  Keybind to toggle (e.g. "Super+grave")
#   width-pct:  (float)   Fractional width (0.0–1.0) of target monitor
#   height-pct: (float)   Fractional height (0.0–1.0) of target monitor
#   width:      (int)     Absolute width in pixels (overrides width-pct)
#   height:     (int)     Absolute height in pixels (overrides height-pct)
#   anchor:     (string)  "top" | "bottom" | "left" | "right"
dropdowns:
  - name: term
    spawn-cmd: "gst"
    keybind: "Super+grave"
    width-pct: 1.0
    height-pct: 0.666667
    anchor: top

# Autostart commands (executed once at compositor startup)
autostart: []

# Monitor configuration (keyed by output name).  Every field is
# independently optional -- unspecified fields are left at the
# compositor's defaults, so you can override just one knob (e.g.
# transform for a tablet that boots in the wrong orientation).
# Changes take effect live on `M-x cmacs-gowl-reload-config` /
# the equivalent `cmacsgi compositor reload` and `Mod+R` keybind.
#
# Output names come from the kernel/DRM (e.g. eDP-1, HDMI-A-1,
# DP-2, headless-1).  Discover the live set via
# `M-: (cmacs-gowl-list-monitors)` or `cmacsgi monitor list`.
#
# Fields:
#   width:     (int)    Preferred mode width  (must pair with height)
#   height:    (int)    Preferred mode height
#   refresh:   (float)  Refresh rate in Hz (0 / omitted = preferred)
#   x:         (int)    Position in layout coordinates
#   y:         (int)    Position in layout coordinates
#   scale:     (float)  HiDPI scale factor (e.g. 1.0, 1.5, 2.0)
#   enabled:   (bool)   true to power on, false to disable
#   transform: (int|string)  wl_output transform:
#                            0 / normal       (no rotation)
#                            1 / 90           (rotated 90 deg CCW)
#                            2 / 180          (upside down)
#                            3 / 270          (rotated 90 deg CW)
#                            4 / flipped      (horizontal mirror)
#                            5 / flipped-90
#                            6 / flipped-180
#                            7 / flipped-270
#
# Example:
#   monitors:
#     eDP-1:
#       transform: 90        # mobile screen: boot already-rotated
#     HDMI-A-1:
#       width: 1920
#       height: 1080
#       refresh: 60.0
#       x: 1080              # placed to the right of eDP-1 (rotated)
#       y: 0
#       scale: 1.0
monitors: {}
# Adaptive sync per output: true, false, or on-demand (only while a
# fullscreen window declares game or video content).
#   monitors:
#     DP-1:
#       vrr: on-demand

# Keyboard layout.  Unset keys fall back to XKB_DEFAULT_* and xkb's defaults.
# xkb-layout: "us,de"
# xkb-variant: ",nodeadkeys"
# xkb-options: "grp:alt_shift_toggle,caps:escape"

# Per-device input settings: a class (touchpad, pointer, keyboard), "*",
# or a glob on the device name; later blocks override earlier ones.
# input:
#   touchpad:
#     tap: true
#     natural-scroll: true
#     accel-speed: 0.2
#   "*TrackPoint*":
#     accel-profile: flat

# Pointer binds.  Super+Button1 move_window and Super+Button3 resize_window
# are always present; naming them here replaces them.
# mousebinds:
#   "Super+Button2":   { action: toggle_float }
#   "Super+WheelDown": { action: focus_stack, arg: "+1" }

# Touchpad gestures: swipe-<left|right|up|down>-<3|4>, pinch-<in|out>-<3|4>.
# A finger count with a gesture bound is taken from the cube, the overview
# and the applications for every gesture of that count.
# gestures:
#   "swipe-left-3":  { action: tag_view, arg: "2" }
#   "swipe-right-3": { action: tag_view, arg: "1" }

# Key modes: a second set of binds, in force while entered.  Super+r
# above enters this one.
modes:
  resize:
    "h":      { action: set_mfact, arg: "-0.05", desc: "Shrink master" }
    "l":      { action: set_mfact, arg: "+0.05", desc: "Grow master" }
    "j":      { action: inc_nmaster, arg: "+1", desc: "One more master" }
    "k":      { action: inc_nmaster, arg: "-1", desc: "One less master" }
    "Escape": { action: mode, arg: default, desc: "Leave resize mode" }
    "Return": { action: mode, arg: default, desc: "Leave resize mode" }

# Module configuration
# Each key is a module name; nested values are passed to the module's configure() method.
modules:
  layout-indicator:
    enabled: false  # CMacs enables the brief layout toast by default
  tile:
    enabled: true
  monocle:
    enabled: true
  tabbed:
    enabled: true
    height: 26             # the tab strip, in logical pixels
    font: sans
  float:
    enabled: true
  scrolling:
    enabled: false  # CMacs loads this layout by default
  animation:
    enabled: false  # opt in here; CMacs loads this module by default
  cube:
    enabled: false  # opt in here; CMacs loads this module by default
  expo:
    enabled: false  # opt in here; CMacs loads this module by default
  switcher:
    enabled: false  # opt in here; CMacs loads this module by default
  magnifier:
    enabled: false  # opt in here; CMacs loads this module by default
  crt:
    enabled: false  # opt in here; CMacs loads this module by default
                    # needed for `crt: true' and for the tour's last
                    # stop.  It
                    # re-renders the whole scene once more per frame and
                    # holds every output it is on awake, so it costs
                    # nothing at all while `crt' is false and a good deal
                    # while it is true
  blur:
    enabled: false  # opt in here; CMacs loads this module by default
  liquidglass:
    enabled: false  # opt in here; CMacs loads this module by default
                    # needed for `window-backdrop: glass', which is the
                    # default -- enable one of these three or nothing
                    # shows through a translucent window
  liquidwater:
    enabled: false  # opt in here; CMacs loads this module by default
                    # needed for `window-backdrop: water'.  It animates,
                    # so it holds an output awake while a translucent
                    # window is on it; see water-fps above
  vanitygaps:
    enabled: true
    # Shorthand: inner-gap / outer-gap set both axes.
    # Per-axis: inner-h, inner-v, outer-h, outer-v override shorthand.
    inner-gap: 5
    outer-gap: 5
  wallpaper:
    enabled: true
    # Absolute path to image file; empty = no wallpaper (solid root color)
    path: "~/Pictures/wallpaper.png"
    # Scaling mode: fill | fit | center | stretch | tile
    mode: fill
  bar:
    enabled: false
    height: 30
    # "base/e6" is the palette's background at 90% opacity.
    bg-color: base/e6
    fg-color: text
    font: "monospace"
    font-size: 11
    #
    # Widgets are placed in three regions.  Each is a space-separated
    # list, in order; the right region reads outward, so the first entry
    # ends up furthest right.
    #
    # A widget is `name', `name:parameter' or `name:parameter@seconds'
    # -- e.g. `disk:/var@60'.  Run `gowl bar-plugins' for the full list
    # of what is registered, including anything you have dropped in
    # ~/.config/gowl/bar-plugins/.
    widgets-left: "tags title"
    widgets-center: "clock"
    # `tray' is the system tray -- see the `tray' key above, which has
    # to be on for it to have anything to draw.
    # `tailscale' decides for itself whether it belongs on this host:
    # hidden where Tailscale is not installed, and where it is but no
    # tailnet has been joined, shown in yellow with a Join button in
    # its panel.  Override with tailscale:always or tailscale:never.
    widgets-right: "cpu memory disk battery tailscale"
    #
    # Which centre widget sits dead centre on the monitor.  Without an
    # anchor the whole centre group is centred, so the clock slides
    # every time something appears beside it.
    center-anchor: "clock"
    #
    # `widgets' with no region keeps its old meaning -- the right-hand
    # status list -- so an existing configuration needs no changes.
    # widgets: "cpu memory disk battery clock"
    #
    # Per-widget colours name a palette role, so one `palette:' setting
    # restyles the whole bar.  A hex literal works too.
    # cpu-color: green
    # memory-color: blue
    # disk-color: yellow
    # battery-color: teal
    # clock-color: text
    #
    # Per-widget settings use `<widget>.<key>':
    # clock.format: "%a %b %d  %H:%M"
    # weather.param: "Muskegon"
    # network.ping-host: "1.1.1.1"
    # title.max-width: "480"
    #
    # The panel and toast styling, on top of the palette:
    # theme-accent: mauve
    # theme-scale: "1.0"
    # theme-metric-panel-width: 400
    # theme-metric-radius: 8
    # theme-icon-font: "Symbols Nerd Font Mono 11"
    #
    # The second bar, on the bottom edge.  One module owns both slots,
    # and a YAML block names one module, so the bottom bar's keys are
    # the same keys with a `bottom-' prefix.  Anything the top bar
    # accepts works here.  (A configuration pushed from Elisp or
    # config.c uses `position: bottom' instead.)
    bottom-enabled: true
    bottom-height: 26
    bottom-bg-color: base/e6
    bottom-widgets-left: "user host"
    bottom-widgets-right: "network podman media"
    bottom-tags.visible: "false"
  alpha:
    enabled: false
    # Opacity for the focused window (0.0 = transparent, 1.0 = opaque)
    focused-alpha: 1.0
    # Opacity for unfocused windows
    unfocused-alpha: 0.8
  pertag:
    enabled: false
  autostart:
    enabled: true
  # org.freedesktop.Notifications for a standalone session: toasts on
  # the bar and a count on its notifications widget.  Idle under cmacs,
  # whose own daemon has the name.
  # Layouts beyond the four above; select them with `set_layout' or by
  # cycling (Super+Tab).  Each registers one layout and costs nothing
  # until it is selected.
  fibonacci:
    enabled: false         # spiral: each window halves what is left
  centeredmaster:
    enabled: false         # master in the middle, stack either side
  bstack:
    enabled: false         # master across the top, stack in a row below
  deck:
    enabled: false         # master, with the stack piled full-size behind
  grid:
    enabled: false         # equal cells, no master
  mirrortile:
    enabled: false         # tile with the columns swapped: master right
  columns:
    enabled: false         # one equal full-height column per window
  # Move the focused window up and down the stack (`move_stack' action).
  movestack:
    enabled: true
  # Window rules, and the float-nudging actions the keybinds use.
  windowrules:
    enabled: true
    step-px: 40            # how far move-float-* and grow-float-* go
  # Rounded window corners.  Stroke only: the corner is drawn, not
  # clipped, so a window's own square corner still shows beneath a
  # busy background.
  roundcorners:
    enabled: false
    radius: 8
  # Clipboard history in the compositor, so no helper daemon is needed.
  # `clipboard-list', `clipboard-copy ID', `clipboard-delete ID',
  # `clipboard-clear' -- over the IPC socket or a keybind's ipc_command.
  clipboard:
    enabled: false
  # The centred pill for a level that just changed: `osd volume 45',
  # `osd brightness 70', `osd show "text"'.
  osd:
    enabled: false
  # Screenshots: `screenshot', `screenshot-area', `screenshot-client'.
  screenshot:
    enabled: false
    save-directory: "~/Pictures"
    filename-format: "screenshot-%Y%m%d-%H%M%S.png"
    copy-to-clipboard: true
  # Screen recording through ffmpeg: `record-start', `record-stop'.
  recording:
    enabled: false
    save-directory: "~/Videos"
    framerate: 30
    codec: libx264
    container: mp4
  # The toggleable overlay terminal (and friends); what each dropdown
  # is lives in the top-level `dropdowns:' section above.
  dropdown:
    enabled: false
  # The bare ping/version/quit IPC handler.  The compositor answers
  # every query and command itself (see docs/ipc.org), so this is only
  # needed by something that speaks to the module directly.
  ipc:
    enabled: false
  notifyd:
    enabled: true
    timeout: 5000          # ms when the sender does not say; 0 never
    widget: notifications
  scratchpad:
    enabled: true
    # The panel's size, the dropdown's settings: fractions of the output's
    # usable area, or pixels (width / height; 0 uses the fraction).
    width-pct: 1.0
    height-pct: 0.666667
    width: 0
    height: 0
    # Pixels between the columns its windows are tiled in.
    gap: 0
  swallow:
    enabled: false
  copyhighlight:
    enabled: false
  screenlock:
    enabled: false
    pam-service: "gowl"
    auto-lock-timeout: 300
    bg-color: base
    text-color: text
    indicator-color: accent
    error-color: red
    font: "monospace"
    font-size: 24
  mcp:
    enabled: false
    # Transport: Unix socket for stdio relay (gowl-mcp binary)
    transport-stdio: true
    # Transport: HTTP+SSE (direct connections)
    transport-http: false
    http-host: "127.0.0.1"
    http-port: 8716
    # http-auth-token: "your-secret-here"
    # Allowed tools (all enabled by default; comment out to disable)
    # tools: |
    #   list_clients
    #   list_monitors
    #   get_tag_state
    #   get_config
    #   list_keybinds
    #   list_modules
    #   get_focused_client
    #   focus_client
    #   close_client
    #   move_client_to_tag
    #   set_client_state
    #   resize_client
    #   move_client
    #   swap_clients
    #   zoom_client
    #   view_tag
    #   toggle_tag_view
    #   set_client_tags
    #   set_mfact
    #   set_nmaster
    #   add_rule
    #   add_keybind
    #   spawn
    #   compositor_quit
    #   send_key
    #   send_text
    #   send_mouse
    #   send_mouse_move
    #   send_scroll
    #   screenshot_client
    #   screenshot_monitor
    #   screenshot_region
