# xdg-desktop-portal routing for a gowl / cmacs --gowl session.
#
# Pin InputCapture, RemoteDesktop and ScreenCast to the gowl backend.
# The first two because only gowl implements them for wlroots (GNOME's
# backend needs Mutter).  ScreenCast because portal-wlr can only offer
# whole outputs -- wlr-screencopy addresses outputs -- while gowl makes
# a toplevel an addressable capture source, so "share this window" in a
# call shares that window and nothing else.  Screenshot still falls
# through to xdg-desktop-portal-wlr, which is what `default' names
# first.
#
# ScreenCast needs PipeWire and a gowl built against wlroots >= 0.20; if
# either is missing the backend declines the interface at startup and
# the frontend falls back to the next one, so this line is safe to keep
# either way.
#
# Install as $XDG_CONFIG_HOME/xdg-desktop-portal/portals.conf or
# /etc/xdg-desktop-portal/gowl-portals.conf (named after the desktop:
# x-d-p reads <desktop>-portals.conf when XDG_CURRENT_DESKTOP contains it).
#
# Secret is pinned explicitly because it would otherwise have NO backend
# here.  The implementation lives in gnome-keyring.portal, whose backend
# name is `gnome-keyring' and whose UseIn is `gnome' -- so neither a
# default of `wlr' nor one of `gtk;gnome' ever names it, and a sandboxed
# app asking org.freedesktop.portal.Secret for its master key gets
# nothing.  gnome-keyring-daemon is running and owns
# org.freedesktop.secrets regardless of which compositor is in front of
# it; only the routing was missing.
#
# Settings is pinned for the same reason, and is the one that gets
# diagnosed wrong.  Every value here is a LIST that x-d-p SEARCHES for a
# backend whose Interfaces= declares the interface being asked for, and
# that includes `default' -- it is not a single fallback backend, it is
# the list every interface with no line of its own resolves through.
# wlr.portal declares only Screenshot and ScreenCast, so a bare
# `default=wlr' left Settings with no implementation at all.  An
# unrouted interface is worse than a missing portal: a missing one
# answers with an error the application can report, while an unrouted
# one is never asked and never answers, and nothing logs a word.  What
# the user sees is not a portal fault at all.  Settings serves
# org.freedesktop.appearance color-scheme (0 no preference, 1 prefer
# dark, 2 prefer light), so the visible symptom is every application set
# to "match system" starting up light-themed in a dark session -- which
# reads as a GTK, theme or toolkit problem and gets chased there.
#
# So `default' is a list too: wlr first to keep Screenshot with
# portal-wlr, then gtk and gnome, which between them carry FileChooser,
# Notification, Print, Inhibit, Access, Account, Email, AppChooser,
# DynamicLauncher, Background, Clipboard, GlobalShortcuts, Lockdown,
# Usb and Wallpaper -- none of which portal-wlr has ever implemented and
# all of which `default=wlr' was silently dropping alongside Settings.
# Naming a backend here overrides its UseIn=, exactly as it does for
# gnome-keyring above, so it does not matter that XDG_CURRENT_DESKTOP
# says gowl rather than gnome.
#
# tests/test-portal-routing.sh checks every line below against the
# Interfaces= each named backend actually declares.
[preferred]
default=wlr;gtk;gnome
org.freedesktop.impl.portal.InputCapture=gowl
org.freedesktop.impl.portal.RemoteDesktop=gowl
org.freedesktop.impl.portal.ScreenCast=gowl
org.freedesktop.impl.portal.Settings=gtk;gnome
org.freedesktop.impl.portal.Secret=gnome-keyring
