# Three connections, one of each kind, as a person would write them.
connections:
  - id: nas-media
    name: NAS media
    type: cifs
    server: nas.lan
    share: media
    user: WORKGROUP\zach
    mountpoint: ~/mnt/nas-media
    automount: true
    options:
      encrypt: true
      readonly: false
      extra:
        - vers=3.1.1
  - id: backup
    name: Backup export
    type: nfs
    server: 192.168.1.20
    export: /srv/backup
    mountpoint: ~/mnt/backup
    options:
      readonly: true
      noexec: true
      nfs-version: "4.2"
      port: 2049
  - id: devbox
    name: Dev box home
    type: sshfs
    server: devbox.lan
    path: /home/zach/src
    user: zach
    mountpoint: ~/mnt/devbox
    options:
      noexec: false
      port: 2222
