# Generated by gowl's webmail bar widget.  Rewritten on every launch;
# change the widget's settings instead of this file.

browser:
  homepage: "https://outlook.cloud.microsoft/mail/"
  new_view_uri: "https://outlook.cloud.microsoft/mail/"
  smooth_scroll: true

window:
  title: "Web mail"
  geometry: 1280x860

storage:
  cache_dir: "/home/u/.cache/gowl-webmail"
  data_dir: "/home/u/.local/share/gowl-webmail"
  cookie_jar: "/home/u/.local/share/gowl-webmail/cookies.sqlite"
  download_dir: "~/Downloads"
  enable_disk_cache: true

webkit:
  javascript: true
  javascript_can_open_windows: false
  media_stream: false
  webrtc: false
  developer_extras: false

tls:
  strict: true

keybinds:
  "Ctrl+r": reload
  "Ctrl+Shift+r": reload-nocache
  "Ctrl+plus": zoom-in
  "Ctrl+minus": zoom-out
  "Ctrl+0": zoom-reset
  "Ctrl+q": quit
  "F11": toggle-fullscreen

mousebinds:
  "Button8": back
  "Button9": forward

modules:
  site_styles:
    enabled: true
    default: ""
    rules:
      - match: "*://outlook.cloud.microsoft/*"
        file: "/run/user/1000/gowl-webmail/theme.css"
      - match: "*://outlook.office.com/*"
        file: "/run/user/1000/gowl-webmail/theme.css"
      - match: "*://outlook.office365.com/*"
        file: "/run/user/1000/gowl-webmail/theme.css"
      - match: "*://outlook.live.com/*"
        file: "/run/user/1000/gowl-webmail/theme.css"
  userscripts:
    enabled: true
    global: "/run/user/1000/gowl-webmail/unread.js"
    dir: ""
    inject_time: end
    rules: {}
  notifications:
    enabled: true
    allow_web_notifications: allow
    urgency: normal
    notify_downloads: true
  downloads:
    enabled: true
    dir: "~/Downloads"
    ask_destination: false
    notify_complete: true
  cookie_policy:
    enabled: true
    policy: always
  modal:
    enabled: false
  find_bar:
    enabled: false
  tabs:
    enabled: false
  chromebar:
    enabled: false
  omnibar:
    enabled: false
  search_engines:
    enabled: false
  bookmarks:
    enabled: false
  history:
    enabled: false
  session:
    enabled: false
  toggles:
    enabled: false
  homepage:
    enabled: false
  dark_mode:
    enabled: false
  adblock:
    enabled: false
  uri_params:
    enabled: false
  cert_manager:
    enabled: false
  useragent:
    enabled: false
  externalpipe:
    enabled: false
  playexternal:
    enabled: false
  mcp:
    enabled: false
  inspector:
    enabled: false
  spacesearch:
    enabled: false
  status_bar:
    enabled: false
  geolocation:
    enabled: false

# colour scheme: dark
